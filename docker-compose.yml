services:
  api:
    build: .
    restart: unless-stopped
    mem_limit: 350m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data:/app/data
      - ./frontend:/app/frontend:ro
    env_file:
      - .env

  caddy:
    image: caddy:alpine
    restart: unless-stopped
    mem_limit: 80m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/static:/srv/static:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
