services:
  api:
    build: .
    # restart: always
    volumes:
      # Cria um túnel: a pasta ./data da VPS reflete na pasta /app/data do contêiner
      - ./data:/app/data
    # Removemos a porta daqui, pois ela não fica exposta para a internet, apenas para o Nginx

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
