<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Valuation FCD</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>

    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
  </head>
  <body
    class="bg-slate-100 font-sans text-slate-800 flex items-center justify-center min-h-screen p-4"
    x-data="loginApp"
    x-cloak
  >
    <div
      class="bg-white p-8 rounded-2xl shadow-xl border border-slate-200 w-full max-w-md"
    >
      <div class="text-center mb-8">
        <div
          class="bg-blue-100 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 shadow-sm border border-blue-200"
        >
          <svg
            class="w-8 h-8 text-blue-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
            ></path>
          </svg>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">
          Acesso Restrito
        </h1>
        <p class="text-slate-500 text-sm mt-1 font-medium">
          Calculadora de Valuation FCD
        </p>
      </div>

      <template x-if="loginErro">
        <div
          class="bg-red-50 text-red-600 text-sm font-semibold p-3 rounded-lg mb-6 text-center border border-red-200 shadow-sm"
          x-text="loginErro"
        ></div>
      </template>

      <form @submit.prevent="fazerLogin" class="space-y-5">
        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1"
            >Usuário</label
          >
          <input
            type="text"
            x-model="loginUsername"
            required
            autocomplete="username"
            class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-medium text-slate-900 bg-slate-50"
          />
        </div>

        <div>
          <label class="block text-sm font-bold text-slate-700 mb-1"
            >Senha</label
          >
          <input
            type="password"
            x-model="loginSenha"
            required
            autocomplete="current-password"
            class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-medium text-slate-900 bg-slate-50"
          />
        </div>

        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3.5 px-4 rounded-xl transition-all shadow-md hover:shadow-lg flex justify-center items-center gap-2 mt-2"
          :disabled="carregando"
          :class="{'opacity-75 cursor-not-allowed': carregando}"
        >
          <span
            x-show="carregando"
            class="animate-spin inline-block w-5 h-5 border-[3px] border-current border-t-transparent text-white rounded-full"
          ></span>
          <span
            x-text="carregando ? 'Autenticando...' : 'Entrar no Sistema'"
          ></span>
        </button>
      </form>
    </div>

    <script>
      document.addEventListener("alpine:init", () => {
        Alpine.data("loginApp", () => ({
          loginUsername: "",
          loginSenha: "",
          loginErro: "",
          carregando: false,

          async fazerLogin() {
            this.carregando = true;
            this.loginErro = "";

            try {
              const resposta = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  username: this.loginUsername,
                  senha: this.loginSenha,
                }),
              });

              const dados = await resposta.json();

              if (!resposta.ok) {
                throw new Error(dados.detail || "Falha na autenticação");
              }

              // Redireciona o usuário. O FastAPI vai checar o Cookie e entregar a calculadora!
              window.location.href = "/";
            } catch (erro) {
              this.loginErro = erro.message;
            } finally {
              this.carregando = false;
            }
          },
        }));
      });
    </script>
  </body>
</html>
