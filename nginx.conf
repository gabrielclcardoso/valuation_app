events {}

http {
    # Redireciona tudo que chega na porta 80 (HTTP) para a porta 443 (HTTPS)
    server {
        listen 80;
        server_name valuation.supermeia.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Configuração do servidor seguro
    server {
        listen 443 ssl;
        server_name valuation.supermeia.com;

        # Aponta para os certificados gerados no Passo 3
        ssl_certificate /etc/letsencrypt/live/valuation.supermeia.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/valuation.supermeia.com/privkey.pem;

        # Otimizações básicas de segurança
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
